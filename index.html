<div class="plex-player-container">
    <div class="plex-toolbar">
        <label class="plex-label" for="plexLibrarySelect">Plex 라이브러리</label>
        <select id="plexLibrarySelect" class="plex-select">
            <option value="">불러오는 중...</option>
        </select>
        <label class="plex-label" for="plexSortSelect">정렬</label>
        <select id="plexSortSelect" class="plex-select">
            <option value="added_desc" selected>최신 등록순</option>
            <option value="added_asc">오래된 등록순</option>
            <option value="title_asc">가나다순</option>
            <option value="title_desc">가나다 역순</option>
            <option value="release_desc">최신 개봉순</option>
            <option value="release_asc">오래된 개봉순</option>
            <option value="">기본순서</option>
        </select>
        <button id="plexBackBtn" class="plex-back-btn" style="display:none;">&larr; 뒤로</button>
        <span id="plexBreadcrumb" class="plex-breadcrumb"></span>
        <span id="plexLoading" class="plex-loading" style="display:none;">불러오는 중...</span>
    </div>

    <div id="plexGrid" class="plex-grid">
        <div class="plex-empty">상단에서 Plex 라이브러리를 선택해주세요.</div>
    </div>

    <div id="plexPagination" class="plex-pagination"></div>
</div>

<div id="plexPlayerOverlay" class="plex-player-overlay" style="display:none;">
    <div class="plex-player-modal">
        <div class="plex-player-header">
            <span id="plexPlayerTitle" class="plex-player-title"></span>
            <button id="plexPlayerClose" class="plex-player-close" aria-label="닫기">&times;</button>
        </div>
        <video id="plexVideoEl" class="plex-video" controls autoplay playsinline></video>
    </div>
</div>
