<div class="plex-player-container">
    <div class="plex-layout" id="plexLayout">
        <div class="plex-main-area">
            <!-- 기본(인라인) 재생 모드일 때 플레이어가 이 자리에 옮겨져 들어옵니다.
                 미니창 모드로 전환하면 여기가 아니라 document.body 아래로 옮겨집니다.
                 재생 중이 아닐 때는 아래 플레이스홀더가 보입니다. -->
            <div id="plexInlinePlayerSlot" class="plex-inline-player-slot">
                <div id="plexPlayerPlaceholder" class="plex-player-placeholder">
                    <div class="plex-placeholder-icon">▶</div>
                    <div class="plex-placeholder-text">오른쪽 목록에서 재생할 영상을 선택하세요.</div>
                </div>
            </div>
        </div>

        <button id="plexSidebarToggle" class="plex-sidebar-toggle" type="button" title="목록 접기/펼치기">&rsaquo;</button>

        <div id="plexSidebar" class="plex-sidebar">
            <div class="plex-sidebar-toolbar">
                <select id="plexLibrarySelect" class="plex-select">
                    <option value="">불러오는 중...</option>
                </select>
                <select id="plexSortSelect" class="plex-select plex-select-sort">
                    <option value="added_desc" selected>최신 등록순</option>
                    <option value="added_asc">오래된 등록순</option>
                    <option value="title_asc">가나다순</option>
                    <option value="title_desc">가나다 역순</option>
                    <option value="release_desc">최신 개봉순</option>
                    <option value="release_asc">오래된 개봉순</option>
                    <option value="">기본순서</option>
                </select>
                <button id="plexLibraryPrefsBtn" class="plex-icon-btn" type="button" title="표시할 라이브러리 선택">&#9881;</button>
            </div>

            <div class="plex-sidebar-subheader">
                <button id="plexBackBtn" class="plex-back-btn" style="display:none;" type="button">&larr; 뒤로</button>
                <span id="plexBreadcrumb" class="plex-breadcrumb"></span>
                <span id="plexLoading" class="plex-loading" style="display:none;">불러오는 중...</span>
            </div>

            <div class="plex-sidebar-search-row">
                <input type="text" id="plexSearchInput" class="plex-search-input" placeholder="제목 검색...">
            </div>

            <div id="plexGrid" class="plex-list">
                <div class="plex-empty">상단에서 Plex 라이브러리를 선택해주세요.</div>
            </div>

            <div id="plexPagination" class="plex-pagination"></div>
        </div>
    </div>
</div>

<div id="plexPlayerOverlay" class="plex-player-overlay" style="display:none;">
    <div class="plex-player-modal" id="plexPlayerModal">
        <div class="plex-player-header" id="plexPlayerHeader" title="드래그해서 위치 이동(미니창 모드에서만)">
            <span id="plexPlayerTitle" class="plex-player-title"></span>
            <button id="plexPlayerSizeBtn" class="plex-player-mini-toggle" type="button" style="display:none;" title="미니창 크기 전환">크기</button>
            <button id="plexPlayerMiniToggle" class="plex-player-mini-toggle" type="button">미니창</button>
            <button id="plexPlayerClose" class="plex-player-close" aria-label="닫기">&times;</button>
        </div>
        <video id="plexVideoEl" class="plex-video" controls autoplay playsinline></video>
        <div id="plexPlayerLoading" class="plex-player-loading-overlay" style="display:none;">
            <div class="plex-player-spinner"></div>
            <div id="plexPlayerLoadingText" class="plex-player-loading-text">동영상을 준비하고 있습니다...</div>
        </div>
        <div id="plexPlayerResizeHandle" class="plex-player-resize-handle" title="드래그해서 크기 조절(미니창 모드에서만)"></div>
    </div>
</div>

<div id="plexLibraryPrefsOverlay" class="plex-modal-overlay" style="display:none;">
    <div class="plex-modal">
        <div class="plex-modal-header">
            <span>표시할 라이브러리 선택</span>
            <button id="plexLibraryPrefsClose" class="plex-player-close" aria-label="닫기">&times;</button>
        </div>
        <div class="plex-modal-body">
            <div class="plex-modal-actions-row">
                <button id="plexLibraryPrefsSelectAll" class="plex-back-btn" type="button">전체 선택</button>
                <button id="plexLibraryPrefsSelectNone" class="plex-back-btn" type="button">전체 해제</button>
            </div>
            <div id="plexLibraryPrefsList" class="plex-library-prefs-list">
                <div class="plex-empty">불러오는 중...</div>
            </div>
            <div id="plexLibraryPrefsResultRow" class="plex-library-prefs-result-row" style="display:none;">
                <div class="plex-library-prefs-result-label">
                    아래 값을 복사해서 환경설정 &gt; 플러그인 설정 &gt; "표시할 라이브러리" 칸에
                    붙여넣고 저장하세요.
                </div>
                <div class="plex-library-prefs-result-input-row">
                    <input type="text" id="plexLibraryPrefsResult" class="plex-search-input" readonly>
                    <button id="plexLibraryPrefsCopy" class="plex-back-btn" type="button">복사</button>
                </div>
            </div>
        </div>
        <div class="plex-modal-footer">
            <span id="plexLibraryPrefsStatus" class="plex-loading"></span>
            <button id="plexLibraryPrefsSave" class="plex-back-btn" type="button">선택값 만들기</button>
        </div>
    </div>
</div>
